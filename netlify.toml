# Netlify deploy settings for the Manasvi Facility Services site.
# With this file committed, Netlify needs no build settings typed in by hand.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# No redirect rules are needed. The build generates a Netlify Function at
# .netlify/functions-internal/server that declares path "/*" with preferStatic,
# so static files serve first and every other URL reaches the server renderer.
# Long-term caching for hashed assets ships from the build's own dist/_headers.
